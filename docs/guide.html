<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyGameSDK documentation</title></head>
<body><p><a id="manual" href="manual/Documentation.html#/en/overview">Open the CyGameSDK manual / Ouvrir le manuel CyGameSDK</a></p>
<script>
(() => {
 const locale=new URLSearchParams(location.search).get('lang')==='fr'?'fr':'en';
 const old=decodeURIComponent(location.hash.slice(1));
 const page=({start:'overview',build:'setup',explore:'workspace',mcp:'automation',adapter:'game-adapters',scope:'limits'})[old]||'overview';
 const target=`manual/Documentation.html#/${locale}/${page}`;
 document.getElementById('manual').href=target;location.replace(target);
})();
</script></body></html>
